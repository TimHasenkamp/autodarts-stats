<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Your Darts – Einstellungen</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 16px; min-width: 360px; max-width: 620px; }
    h1 { font-size: 1.2rem; margin: 0 0 12px; }
    h2 { font-size: 0.95rem; margin: 20px 0 6px; }
    label { display: block; font-size: 0.85rem; margin: 10px 0 4px; opacity: 0.8; }
    label.check { display: flex; gap: 8px; align-items: center; margin-top: 12px; opacity: 1; }
    label.check input { width: auto; }
    input { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; border: 1px solid #8884; border-radius: 6px; background: transparent; color: inherit; }
    .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    button { padding: 8px 12px; font: inherit; border-radius: 6px; border: 1px solid #8886; background: #8882; color: inherit; cursor: pointer; }
    button.primary { background: #009999; border-color: #009999; color: #fff; }
    #status, #test { margin-top: 12px; font-size: 0.85rem; white-space: pre-wrap; }
    details { margin-top: 16px; font-size: 0.85rem; }
    .ok { color: #2e7d32; } .err { color: #c62828; } .warn { color: #b26a00; }
    table.diag { width: 100%; border-collapse: collapse; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
    table.diag td { padding: 3px 4px; border-bottom: 1px solid #8883; }
    table.diag td:last-child { text-align: right; font-weight: 600; }
    .hint { font-size: 0.8rem; opacity: 0.85; margin: 8px 0 0; }
    code { font-size: 0.78rem; word-break: break-all; opacity: 0.8; }
  </style>
</head>
<body>
  <h1>Your Darts Collector</h1>
  <label for="backendUrl">Backend-URL</label>
  <input id="backendUrl" type="url" placeholder="http://localhost:8080">
  <label for="apiKey">API-Key (Board)</label>
  <input id="apiKey" type="password" autocomplete="off">
  <label for="boardName">Board-Name (nur zur Info)</label>
  <input id="boardName" type="text" placeholder="Wohnzimmer">
  <label class="check"><input id="showOverlay" type="checkbox"> Eingecheckte Spieler auf play.autodarts.io einblenden</label>
  <label class="check"><input id="captureAll" type="checkbox"> Alles erfassen (Debug, ignoriert die Filter)</label>
  <div class="row">
    <button id="save" class="primary">Speichern</button>
    <button id="testBtn">Verbindung testen</button>
    <button id="flush">Queue senden</button>
    <button id="clear">Queue leeren</button>
  </div>
  <div id="test"></div>

  <h2>Diagnose</h2>
  <div id="diagBox">
    <p class="hint">Seite play.autodarts.io offen halten und neu laden, dann hier nachsehen.</p>
  </div>
  <div class="row">
    <button id="reset">Zähler zurücksetzen</button>
  </div>
  <div id="status"></div>

  <details>
    <summary>Erweitert: Filter</summary>
    <label for="fetchPattern">URL-Muster (Regex) für HTTP-Antworten</label>
    <input id="fetchPattern" type="text">
    <label for="wsPattern">Muster (Regex) für WebSocket-Nachrichten, leer = alle</label>
    <input id="wsPattern" type="text">
    <label for="excludePattern">Ausschluss-Muster (Regex) für URLs</label>
    <input id="excludePattern" type="text">
  </details>
  <script src="options.js"></script>
</body>
</html>
